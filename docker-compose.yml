# Local development (hot reload): start only Postgres, then run the app on the host.
#   docker compose up -d
#   yarn prisma:migrate && yarn dev
#
# Full stack (production image, no hot reload):
#   docker compose --profile app up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hhais}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hhais}
      POSTGRES_DB: ${POSTGRES_DB:-hhais}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hhais_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside Compose the DB hostname is the `db` service, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-hhais}:${POSTGRES_PASSWORD:-hhais}@db:5432/${POSTGRES_DB:-hhais}?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  hhais_pgdata:
